<title>Rak Buku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen app. Top bar, then the bookcase (or list) filling the rest; a reading drawer slides in from the right (bottom sheet on phones). Warm reading-room palette: cream paper, terracotta, sage. */
:root {
  --paper: #f3eadc;
  --surface: #fbf6ee;
  --ink: #3a2a1f;
  --muted: #86705f;
  --line: #e4d4bf;
  --accent: #c0623a;
  --accent-ink: #ffffff;
  --sage: #74895d;
  --sage-soft: #e2e4d0;
  --peach: #f4dcc2;
  --lamp: #e9a93a;
  --scene: #efe3d1;
  --wood: #a8744d;
  --shadow: rgba(90, 55, 30, .16);
  --ok: #5c7c42;
  --warn: #b0692a;
  --danger: #b3361f;
  --f-display: "Fraunces", Georgia, "Times New Roman", serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1c1611; --surface: #282019; --ink: #f2e6d7; --muted: #b29d88; --line: #3c3027;
    --accent: #e3895d; --accent-ink: #1c1611; --sage: #a5bb8c; --sage-soft: #323727; --peach: #4b3425;
    --lamp: #f0b54f; --scene: #17120e; --wood: #6c4a33; --shadow: rgba(0, 0, 0, .5); --ok: #a3c486; --warn: #e6b066; --danger: #f08a73; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1c1611; --surface: #282019; --ink: #f2e6d7; --muted: #b29d88; --line: #3c3027;
  --accent: #e3895d; --accent-ink: #1c1611; --sage: #a5bb8c; --sage-soft: #323727; --peach: #4b3425;
  --lamp: #f0b54f; --scene: #17120e; --wood: #6c4a33; --shadow: rgba(0, 0, 0, .5); --ok: #a3c486; --warn: #e6b066; --danger: #f08a73; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-family: var(--f-body); font-size: 12px; font-weight: 400; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--paper); }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.grow { flex: 1 1 160px; min-width: 0; display: flex; gap: 8px; }
.search { flex: 1; min-width: 0; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); }
.sel { padding: 7px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); max-width: 40%; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 12px; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: none; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }

.stage { position: relative; flex: 1; min-height: 0; }
#scene { position: absolute; inset: 0; background: var(--scene); }
#scene canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#scene canvas.hovering { cursor: pointer; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.shelf-label {
  position: absolute; transform: translate(0, -50%); white-space: nowrap;
  font-family: var(--f-display); font-size: 14px; font-weight: 600;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px;
  box-shadow: 0 1px 3px var(--shadow);
}
.shelf-label b { font-family: var(--f-body); color: var(--accent); font-weight: 700; margin-left: 6px; font-size: 12px; }
.hint {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 12px; font-family: var(--f-mono); font-size: 11px; color: var(--muted);
  background: color-mix(in srgb, var(--surface) 80%, transparent); padding: 4px 8px; border-radius: 6px;
}
.tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 13px;
  padding: 4px 9px; border-radius: 6px; transform: translate(-50%, calc(-100% - 12px)); white-space: nowrap; max-width: 60vw; overflow: hidden; text-overflow: ellipsis;
}
.empty {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
}
.empty div { max-width: 34ch; display: grid; gap: 12px; justify-items: center; }
.empty h2 { font-family: var(--f-display); margin: 0; font-size: 22px; text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); }

/* list view */
#list { position: absolute; inset: 0; overflow-y: auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.list-inner { max-width: 880px; margin: 0 auto; display: grid; gap: 28px; }
.group h3 { font-family: var(--f-display); font-size: 20px; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
.group h3 span { font-family: var(--f-mono); font-size: 12px; font-weight: 400; color: var(--muted); }
.rows { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); overflow: hidden; }
.row {
  width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 14px;
}
.row:first-child { border-top: 0; }
.row:hover { background: var(--paper); }
.swatch { width: 10px; height: 34px; border-radius: 2px; justify-self: center; }
.thumb.mini { width: 26px; border-radius: 3px; box-shadow: 0 1px 3px var(--shadow); }
.thumb.mini em { display: none; }
.thumb.mid { width: 76px; border-radius: 6px; }
.thumb.mid em { font-size: 9px; }
.dhead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; }
.dhead.nocover { grid-template-columns: minmax(0, 1fr); }
.row-main { min-width: 0; }
.row-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { font-family: var(--f-mono); font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.st-selesai { color: var(--ok); border-color: currentColor; }
.chip.st-sedang { color: var(--warn); border-color: currentColor; }
.chip.ai { background: var(--sage-soft); color: var(--sage); border-color: transparent; font-weight: 700; }

/* reading drawer */
.drawer {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(440px, 100%);
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: -10px 0 30px var(--shadow);
  display: flex; flex-direction: column; animation: slide .32s ease-out;
}
@keyframes slide { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.drawer-body { overflow-y: auto; padding: 16px 16px 32px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.drawer-body > * { flex-shrink: 0; }
.drawer h2 { font-family: var(--f-display); font-size: 26px; line-height: 1.15; margin: 0; text-wrap: balance; }
.meta { color: var(--muted); margin: 4px 0 0; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label.f { display: grid; gap: 4px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
label.f input, label.f select, label.f textarea { font-family: var(--f-body); font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--ink); padding: 8px 11px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); width: 100%; min-width: 0; }
.x { border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 8px; color: var(--muted); }
.link { color: var(--accent); word-break: break-all; }

.cur { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.cur-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; background: var(--paper); border-bottom: 1px solid var(--line); }
.cur-head strong { font-family: var(--f-display); }
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 6px 10px; border-radius: 6px 6px 0 0; font-family: var(--f-display); font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabpane { padding: 12px 14px 16px; }
.tabpane p { margin: 0; }
.tabpane ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.terms { display: grid; gap: 10px; margin: 0; }
.terms dt { font-weight: 600; }
.terms dd { margin: 0; color: var(--muted); }
.card {
  perspective: 900px; height: 190px; border: 0; background: none; padding: 0; width: 100%;
}
.card-in { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
.card.flipped .card-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 18px; padding: 16px; display: grid; place-items: center; text-align: center; border: 1px solid var(--line); overflow-y: auto; }
.face.front { background: var(--paper); font-family: var(--f-display); font-size: 17px; font-weight: 600; }
.face.back { background: var(--accent); color: var(--accent-ink); transform: rotateY(180deg); }
.face small { position: absolute; top: 8px; left: 10px; font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.card-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.source { display: grid; gap: 10px; padding: 12px 14px; }
.source p { margin: 0; font-size: 14px; color: var(--muted); }
.status-line { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.status-line.err { color: var(--danger); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }

/* add sheet */
.modal { position: fixed; inset: 0; background: rgba(40, 24, 12, .42); display: grid; place-items: center; padding: 16px; z-index: 20; }
.sheet { background: var(--paper); border-radius: 24px; width: min(540px, 100%); max-height: 100%; overflow-y: auto; padding: 16px 18px 22px; display: grid; gap: 14px; align-content: start; box-shadow: 0 20px 60px var(--shadow); }
.sheet-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.sheet-head h2 { font-family: var(--f-display); font-weight: 700; margin: 0; font-size: 22px; text-align: center; }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; padding: 6px; }
.link-btn svg, .btn svg, .searchbox svg, .scanicon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.pane { display: grid; gap: 12px; align-content: start; min-width: 0; }
.kinds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kinds button { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 9px 6px; display: grid; gap: 1px; text-align: center; font-weight: 700; }
.kinds button span { font-size: 12px; color: var(--muted); font-weight: 400; }
.kinds button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.searchbox { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 999px; padding: 4px 16px; color: var(--accent); }
.searchbox input { flex: 1; min-width: 0; border: 0; background: none; padding: 10px 0; font-size: 17px; color: var(--ink); outline: none; }
.seg.wide { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); }
.seg.wide button { padding: 9px 0; font-size: 16px; }
.scanrow { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 6px 2px 14px; }
.scanicon { width: 46px; height: 46px; border-radius: 50%; background: var(--peach); color: var(--accent); display: grid; place-items: center; }
.scantext { display: grid; }
.scantext b { font-size: 17px; }
.scantext small { color: var(--muted); font-size: 14px; }
.chev { color: var(--muted); font-size: 24px; line-height: 1; }
.scanbox { position: relative; border-radius: 16px; overflow: hidden; background: #000; display: grid; }
.scanbox video { width: 100%; max-height: 300px; object-fit: cover; display: block; }
.scanline { position: absolute; left: 12%; right: 12%; top: 50%; height: 2px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.scanbox .btn { position: absolute; right: 10px; bottom: 10px; }
.results-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.results-head span:first-child { font-weight: 700; font-size: 17px; color: var(--muted); }
.results-head span:last-child { color: var(--accent); font-weight: 600; font-size: 14px; }
.results { display: grid; gap: 10px; }
.result { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 10px 14px 10px 10px; }
.result:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.result-main { display: grid; gap: 2px; min-width: 0; }
.result-main b { font-family: var(--f-display); font-size: 17px; line-height: 1.2; }
.by { color: var(--muted); }
.pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--paper); color: var(--muted); }
.pill.warm { background: var(--peach); color: var(--ink); }
.thumb { position: relative; width: 52px; aspect-ratio: 2 / 3; border-radius: 6px; overflow: hidden; background: var(--c, #8a6d3b); box-shadow: 0 3px 8px var(--shadow); display: grid; flex: none; max-width: 100%; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb em { font-style: normal; font-family: var(--f-display); color: #fff; font-size: 8px; line-height: 1.15; padding: 5px; overflow: hidden; }
.thumb.big { width: 150px; border-radius: 10px; transform: rotate(-2deg); box-shadow: 0 16px 36px var(--shadow); }
.thumb.big em { font-size: 16px; padding: 12px; }
.back { justify-self: start; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--surface); font-size: 20px; box-shadow: 0 2px 6px var(--shadow); }
.hero-cover { display: grid; place-items: center; padding: 4px 0 8px; }
.book-title { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.1; margin: 0; text-align: center; text-wrap: balance; }
.book-by { margin: -4px 0 0; text-align: center; color: var(--muted); font-size: 16px; }
.btn.big { padding: 13px 18px; font-size: 17px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
.facts { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 16px; }
.facts div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-top: 1px solid var(--line); }
.facts div:first-child { border-top: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.desc { margin: 0; color: var(--muted); font-size: 14px; }
.sheet .actions { display: flex; }

@media (max-width: 640px) {
  .brand small { display: none; }
  .drawer { top: auto; height: 72%; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; animation-name: rise; }
  @keyframes rise { from { transform: translateY(30px); opacity: .4; } to { transform: none; opacity: 1; } }
  .fields { grid-template-columns: 1fr; }
  .modal { padding: 0; }
  .sheet { width: 100%; height: 100%; border-radius: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .drawer, .card-in { animation: none; transition: none; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">Rak Buku <small id="modeNote">memuat…</small></div>
    <div class="seg" role="group" aria-label="Tampilan">
      <button id="vRak" aria-pressed="true">Rak 3D</button>
      <button id="vList" aria-pressed="false">Daftar</button>
    </div>
    <div class="grow">
      <input id="q" class="search" type="search" placeholder="Cari judul, penulis, rak…" aria-label="Cari">
      <select id="fKind" class="sel" aria-label="Jenis">
        <option value="">Semua jenis</option>
        <option value="buku">Buku</option>
        <option value="artikel">Artikel</option>
        <option value="materi">Materi kuliah</option>
      </select>
    </div>
    <button id="addBtn" class="btn primary">+ Tambah</button>
  </header>

  <main class="stage">
    <div id="scene"></div>
    <div id="labels"></div>
    <div id="tip" class="tip" hidden></div>
    <div id="hint" class="hint">Seret untuk geser · klik buku untuk menariknya</div>
    <div id="empty" class="empty" hidden>
      <div>
        <h2>Rakmu masih kosong</h2>
        <p>Tambahkan buku, artikel, atau PDF materi kuliah. Setiap rak berisi satu mata kuliah atau topik.</p>
        <button class="btn primary" id="emptyAdd">Tambah item pertama</button>
      </div>
    </div>
    <div id="list" hidden><div class="list-inner" id="listInner"></div></div>
    <aside id="drawer" class="drawer" hidden aria-label="Detail item"></aside>
  </main>
</div>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <button type="button" class="x" id="addCancel" aria-label="Tutup">×</button>
      <h2 id="sheetTitle">Tambah buku</h2>
      <button type="button" class="link-btn" id="manualBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M4 11h10M4 16h6M15 19l5-5-2-2-5 5v2z"/></svg><span>Manual</span>
      </button>
    </div>
    <div class="kinds" role="group" aria-label="Jenis item">
      <button type="button" data-kind="buku" aria-pressed="true">Buku<span>cari atau scan</span></button>
      <button type="button" data-kind="artikel" aria-pressed="false">Artikel<span>tempel URL</span></button>
      <button type="button" data-kind="materi" aria-pressed="false">Materi kuliah<span>unggah PDF</span></button>
    </div>

    <section id="bookSearch" class="pane">
      <label class="searchbox">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input id="bq" type="search" placeholder="Judul buku, mis. Laut Bercerita" aria-label="Cari buku" enterkeyhint="search">
      </label>
      <div class="seg wide" role="group" aria-label="Cari berdasarkan">
        <button type="button" data-by="title" aria-pressed="true">Judul</button>
        <button type="button" data-by="author" aria-pressed="false">Penulis</button>
        <button type="button" data-by="isbn" aria-pressed="false">ISBN</button>
      </div>
      <button type="button" class="scanrow" id="scanBtn">
        <span class="scanicon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M7 8v8M10 8v8M13 8v8M16 8v8"/></svg></span>
        <span class="scantext"><b>Scan barcode</b><small>Cara tercepat menemukan edisi yang tepat</small></span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
      <input id="scanFile" type="file" accept="image/*" capture="environment" hidden>
      <div id="scanBox" class="scanbox" hidden>

(() => {

  { title: "Binary Heap (VisuAlgo)", author: "visualgo.net", kind: "artikel", url: "https://visualgo.net/en/heap", shelf: "Struktur Data", status: "mau", contoh: true },
  { title: "Laut Bercerita", author: "Leila S. Chudori", kind: "buku", shelf: "Bacaan santai", status: "selesai", contoh: true },
  { title: "Bumi Manusia", author: "Pramoedya Ananta Toer", kind: "buku", shelf: "Bacaan santai", status: "selesai", contoh: true },

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function colorFor(item) { return item.color || SPINE_COLORS[hash(item.title + item.shelf) % SPINE_COLORS.length]; }
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function newId() { return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function byShelf(items) {
  const map = new Map();
  for (const it of items) { const k = it.shelf || "Tanpa rak"; if (!map.has(k)) map.set(k, []); map.get(k).push(it); }
  for (const arr of map.values()) arr.sort((a, b) => (a.createdAt || "").localeCompare(b.createdAt || ""));
  return [...map.entries()].sort((a, b) => a[0].localeCompare(b[0], "id"));
}

// ---------- state ----------
const S = { items: [], q: "", kind: "", view: lsGet("rakbuku.view", "rak"), selected: null, tab: "ringkasan", card: 0, flipped: false, busy: null, confirmDelete: false };

// ---------- storage: shared database when the viewer provides one, else this browser ----------
const store = {
  mode: "local", db: null,
  async init(onChange) {
    const claude = window.claude;
    const db = claude?.use ? await claude.use("db").catch(() => null) : null;
    if (db) {
      this.mode = "db"; this.db = db;
      db.collection("items").onSnapshot((snap) => onChange(snap.docs.map((d) => ({ ...d.data(), id: d.id }))), (e) => setNote("gagal memuat: " + (e?.message || e)));
      return;
    }
    let items = lsGet("rakbuku.items", null);
    if (!items) { const t = Date.now(); items = EXAMPLES.map((e, i) => ({ ...e, id: newId() + i, createdAt: new Date(t + i).toISOString() })); lsSet("rakbuku.items", items); }
    this.local = items; onChange(items.slice());
    this.onChange = onChange;
  },
  async add(data) {
    data = { ...data, createdAt: new Date().toISOString() };
    if (this.mode === "db") { const ref = await this.db.collection("items").add(data); return ref.id; }
    const id = newId(); this.local.push({ ...data, id }); this.saveLocal(); return id;
  },
  async update(id, patch) {
    if (this.mode === "db") return this.db.collection("items").doc(id).update(patch);
    const it = this.local.find((x) => x.id === id); if (it) Object.assign(it, patch); this.saveLocal();
  },
  async remove(id) {
    if (this.mode === "db") return this.db.collection("items").doc(id).delete();
    this.local = this.local.filter((x) => x.id !== id); this.saveLocal();
  },
  saveLocal() { lsSet("rakbuku.items", this.local); this.onChange(this.local.map((x) => ({ ...x }))); },
};

// ---------- AI: Claude via the viewer when available, else the Claude API with the user's own key ----------
const ai = {
  sample: null,
  async init() { this.sample = window.claude?.use ? await window.claude.use("sample").catch(() => null) : null; },
  get ready() { return !!this.sample || !!lsGet("rakbuku.apikey", ""); },
  async curate(item, text) {
    const prompt = `Kamu membantu seorang mahasiswa memahami bacaannya lebih cepat. Baca teks di bawah ini lalu kurasi dalam Bahasa Indonesia yang sederhana dan jelas.

Balas HANYA dengan satu objek JSON berbentuk:
{"ringkasan": "3-5 kalimat inti materi",
 "poin": ["5-8 poin kunci, masing-masing satu kalimat"],
 "istilah": [{"istilah": "nama konsep", "arti": "penjelasan satu kalimat"}],
 "kartu": [{"tanya": "pertanyaan yang menguji pemahaman", "jawab": "jawaban singkat"}]}
Buat 3-8 istilah dan 6-10 kartu. Kartu harus menguji pemahaman konsep, bukan hafalan angka halaman. Jika teks berbahasa Inggris, tetap jawab dalam Bahasa Indonesia tetapi pertahankan istilah teknis aslinya dalam kurung.

Judul: ${item.title}
Jenis: ${KIND[item.kind]}
Rak: ${item.shelf}

<teks>
${text}
</teks>`;
    let out;
    if (this.sample) {
      out = await this.sample.json(prompt, { modelTier: "default" });
    } else {
      const key = lsGet("rakbuku.apikey", "");
      if (!key) throw new Error("Masukkan kunci API Claude dulu.");
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: API_MODEL, max_tokens: 4000, messages: [{ role: "user", content: prompt }] }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body?.error?.message || "Permintaan ke Claude gagal (" + res.status + ").");
      const txt = (body.content || []).filter((c) => c.type === "text").map((c) => c.text).join("");
      const a = txt.indexOf("{"), b = txt.lastIndexOf("}");
      out = JSON.parse(txt.slice(a, b + 1));
    }
    if (!out || typeof out.ringkasan !== "string") throw new Error("Jawaban Claude tidak berbentuk yang diharapkan. Coba lagi.");
    return {
      ringkasan: out.ringkasan,
      poin: Array.isArray(out.poin) ? out.poin.map(String) : [],
      istilah: Array.isArray(out.istilah) ? out.istilah.filter((x) => x && x.istilah) : [],
      kartu: Array.isArray(out.kartu) ? out.kartu.filter((x) => x && x.tanya) : [],
      dibuat: new Date().toISOString(),
    };
  },
};

// ---------- PDF text extraction (pdf.js loaded on first use) ----------
function loadScript(src) { return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => fail(new Error("Gagal memuat " + src)); document.head.appendChild(s); }); }
let pdfReady = null;
function loadPdfJs() {
  // Loading the worker as a plain script lets pdf.js run on the main thread, which works inside sandboxed frames too.
  pdfReady ||= (async () => {
    const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    await loadScript(base + "pdf.min.js");
    await loadScript(base + "pdf.worker.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
    return window.pdfjsLib;
  })();
  return pdfReady;
}
async function pdfToText(file, onProgress) {
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let text = "";
  for (let p = 1; p <= doc.numPages && text.length < MAX_SOURCE_CHARS; p++) {
    onProgress?.(p, doc.numPages);
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    text += `\n[hal. ${p}]\n` + tc.items.map((i) => i.str).join(" ");
  }
  text = text.replace(/[ \t]+/g, " ").trim().slice(0, MAX_SOURCE_CHARS);
  if (text.length < 40) throw new Error("PDF ini tidak berisi teks yang bisa dibaca (mungkin hasil scan). Tempel teksnya secara manual.");
  return { text, pages: doc.numPages };
}

// =====================================================================
// 3D bookcase
// =====================================================================
const scene3 = (() => {
  const host = $("scene");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  host.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x554433, 0.75));
  const lamp = new THREE.DirectionalLight(0xffe2b0, 0.85); lamp.position.set(-4, 6, 8); scene.add(lamp);
  const fill = new THREE.DirectionalLight(0xbfd8ff, 0.25); fill.position.set(6, -2, 6); scene.add(fill);

  let caseGroup = null, books = [], rows = [], bounds = { minX: 0, maxX: 0, minY: 0, maxY: 0 };
  const cam = { x: 0, y: 0, z: 9, tx: 0, ty: 0 };
  let hovered = null, pulled = null;

  function applyTheme() {
    scene.background = new THREE.Color(cssVar("--scene") || "#dfe5e0");
    if (caseGroup) caseGroup.traverse((o) => { if (o.userData.wood) o.material.color.set(cssVar("--wood") || "#8b6b50"); });
  }

  function spineTexture(item, w, h) {
    const c = document.createElement("canvas"); c.width = Math.max(48, Math.round(w * 220)); c.height = Math.round(h * 220);
    const g = c.getContext("2d"); const col = colorFor(item);
    g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
    const shade = g.createLinearGradient(0, 0, c.width, 0);
    shade.addColorStop(0, "rgba(0,0,0,.28)"); shade.addColorStop(.25, "rgba(255,255,255,.08)"); shade.addColorStop(1, "rgba(0,0,0,.3)");
    g.fillStyle = shade; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = "rgba(255,255,255,.55)";
    if (item.kind === "buku") { g.fillRect(0, c.height * .08, c.width, 3); g.fillRect(0, c.height * .92, c.width, 3); }
    if (item.kind === "materi") { g.fillStyle = "#f4f1e6"; g.fillRect(c.width * .15, c.height * .06, c.width * .7, c.height * .2); g.fillStyle = "#333"; g.font = `600 ${Math.round(c.width * .22)}px JetBrains Mono, monospace`; g.textAlign = "center"; g.fillText("PDF", c.width / 2, c.height * .18); }
    if (item.curation) { g.fillStyle = "#f0b54f"; g.beginPath(); g.arc(c.width / 2, c.height * .95 - 4, Math.min(8, c.width * .14), 0, 7); g.fill(); }
    g.save(); g.translate(c.width / 2, c.height * (item.kind === "materi" ? .6 : .5)); g.rotate(-Math.PI / 2);
    g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
    const size = Math.min(c.width * .42, 30); g.font = `600 ${size}px "Bricolage Grotesque", system-ui, sans-serif`;
    let t = item.title; const maxW = c.height * (item.kind === "materi" ? .6 : .78);
    while (g.measureText(t).width > maxW && t.length > 3) t = t.slice(0, -2);
    if (t !== item.title) t = t.replace(/\s*\S?$/, "") + "…";
    g.fillText(t, 0, 0); g.restore();
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 4; return tex;
  }
  function coverTexture(item, d, h) {
    const c = document.createElement("canvas"); c.width = Math.round(d * 300); c.height = Math.round(h * 300);
    const g = c.getContext("2d"); const col = colorFor(item);
    g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(c.width * .08, c.height * .08, c.width * .84, c.height * .84);
    g.fillStyle = "#fff"; g.font = `500 ${Math.round(c.width * .05)}px "JetBrains Mono", monospace`;
    g.fillText(KIND[item.kind].toUpperCase() + " · " + (item.shelf || "").toUpperCase().slice(0, 22), c.width * .13, c.height * .17);
    g.font = `700 ${Math.round(c.width * .1)}px "Bricolage Grotesque", system-ui, sans-serif`;
    const words = item.title.split(/\s+/); let line = "", y = c.height * .32; const lh = c.width * .12;
    for (const w of words) { const t = line ? line + " " + w : w; if (g.measureText(t).width > c.width * .74 && line) { g.fillText(line, c.width * .13, y); y += lh; line = w; } else line = t; if (y > c.height * .7) break; }
    if (line && y <= c.height * .7) g.fillText(line, c.width * .13, y);
    g.font = `400 ${Math.round(c.width * .055)}px Literata, Georgia, serif`; g.fillStyle = "rgba(255,255,255,.85)";
    g.fillText((item.author || "").slice(0, 34), c.width * .13, c.height * .85);
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 4; return tex;
  }
  function dims(item) {
    const r = (hash(item.title) % 1000) / 1000;
    if (item.kind === "artikel") return { w: .09 + r * .04, h: 1.45, d: 1.02 };
    if (item.kind === "materi") return { w: .42, h: 1.75, d: 1.22 };
    return { w: .2 + r * .22, h: 1.45 + ((hash(item.author || item.title) % 100) / 100) * .45, d: 1.1 + r * .1 };
  }

  // Real cover art needs a CORS-enabled image; Open Library covers by ISBN usually are. Anything else keeps the drawn cover.
  const coverCache = new Map();
  function loadImage(url) {
    if (!coverCache.has(url)) coverCache.set(url, new Promise((ok) => { const im = new Image(); im.crossOrigin = "anonymous"; im.onload = () => ok(im.naturalWidth > 1 ? im : null); im.onerror = () => ok(null); im.src = url; }));
    return coverCache.get(url);
  }
  function averageColor(im) {
    try { const c = document.createElement("canvas"); c.width = c.height = 8; const g = c.getContext("2d"); g.drawImage(im, 0, 0, 8, 8); const d = g.getImageData(0, 0, 8, 8).data; let r = 0, gg = 0, bb = 0; for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; bb += d[i + 2]; } const n = d.length / 4; const col = new THREE.Color(r / n / 255, gg / n / 255, bb / n / 255); const hsl = {}; col.getHSL(hsl); col.setHSL(hsl.h, Math.min(1, hsl.s * 1.1), Math.min(.42, hsl.l)); return "#" + col.getHexString(); } catch { return null; }
  }
  async function applyRealCover(mesh) {
    const it = mesh.userData.item;
    const urls = [it.isbn && `https://covers.openlibrary.org/b/isbn/${encodeURIComponent(it.isbn)}-M.jpg?default=false`, it.cover].filter(Boolean);
    for (const u of urls) {
      const im = await loadImage(u);
      if (!im || !books.includes(mesh)) continue;
      const { width: w, height: h, depth: d } = mesh.geometry.parameters;
      const c = document.createElement("canvas"); c.width = Math.round(d * 300); c.height = Math.round(h * 300);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 4;
      const mats = mesh.material; mats[1].map?.dispose(); mats[1].map = tex; mats[1].needsUpdate = true;
      const col = averageColor(im);
      if (col) {
        const tinted = { ...it, color: col };
        mats[4].map?.dispose(); mats[4].map = spineTexture(tinted, w, h); mats[4].needsUpdate = true;
        mats[0].color.set(col); mesh.userData.base[0] = mats[0].color.clone();
      }
      applyFilter();
      return;
    }
  }

  function disposeCase() {
    if (!caseGroup) return;
    caseGroup.traverse((o) => { if (o.geometry) o.geometry.dispose(); const ms = Array.isArray(o.material) ? o.material : o.material ? [o.material] : []; for (const m of ms) { m.map?.dispose(); m.dispose(); } });
    scene.remove(caseGroup); caseGroup = null; books = []; rows = [];
  }

  function build(items) {
    const keepPulled = pulled?.userData.item.id;
    disposeCase(); hovered = null; pulled = null; labelEls = [];
    caseGroup = new THREE.Group(); scene.add(caseGroup);
    const groups = byShelf(items);
    const rowH = 2.35, gap = .03, pad = .35;
    // width of the case = widest shelf
    let W = 6;
    for (const [, arr] of groups) W = Math.max(W, arr.reduce((s, it) => s + dims(it).w + gap, 0) + 2 * pad);
    const wood = new THREE.MeshStandardMaterial({ color: cssVar("--wood") || "#8b6b50", roughness: .85 });
    const woodMesh = (geo) => { const m = new THREE.Mesh(geo, wood.clone()); m.userData.wood = true; caseGroup.add(m); return m; };
    const nRows = Math.max(groups.length, 1);
    const totalH = nRows * rowH;
    const x0 = -W / 2;
    // sides, top, back
    woodMesh(new THREE.BoxGeometry(.16, totalH + .2, 1.6)).position.set(x0 - .08, -totalH / 2 + rowH, 0);
    woodMesh(new THREE.BoxGeometry(.16, totalH + .2, 1.6)).position.set(-x0 + .08, -totalH / 2 + rowH, 0);
    woodMesh(new THREE.BoxGeometry(W + .32, .16, 1.6)).position.set(0, rowH + .1, 0);
    const back = woodMesh(new THREE.BoxGeometry(W + .32, totalH + .2, .06)); back.position.set(0, -totalH / 2 + rowH, -.78); back.userData.wood = false;
    back.material.color.set(cssVar("--wood") || "#8b6b50").multiplyScalar(.62);

    groups.forEach(([shelf, arr], r) => {
      const baseY = -r * rowH; // top surface of plank
      woodMesh(new THREE.BoxGeometry(W, .14, 1.6)).position.set(0, baseY - .07, 0);
      rows.push({ shelf, count: arr.length, pos: new THREE.Vector3(x0 + .1, baseY - .07, .82) });
      let x = x0 + pad;
      for (const it of arr) {
        const { w, h, d } = dims(it);
        const col = new THREE.Color(colorFor(it));
        const pages = new THREE.MeshStandardMaterial({ color: it.kind === "materi" ? 0xe9e6dc : 0xefe8d6, roughness: .95 });
        const plain = new THREE.MeshStandardMaterial({ color: col, roughness: .7 });
        const spine = new THREE.MeshStandardMaterial({ map: spineTexture(it, w, h), roughness: .65 });
        const cover = new THREE.MeshStandardMaterial({ map: coverTexture(it, d, h), roughness: .65 });
        // face order: +x, -x, +y, -y, +z (spine, faces the room), -z
        const mats = [plain, cover, pages, pages, spine, pages];
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats);
        const lean = it.kind === "artikel" ? 0 : ((hash(it.title) % 7) - 3) * .004;
        mesh.position.set(x + w / 2, baseY + h / 2, .75 - d / 2);
        mesh.rotation.z = lean;
        mesh.userData = { item: it, home: mesh.position.clone(), homeRot: new THREE.Euler(0, 0, lean), base: mats.map((m) => m.color.clone()) };
        caseGroup.add(mesh); books.push(mesh);
        x += w + gap;
      }
    });
    bounds = { minX: x0 + 2, maxX: -x0 - 2, minY: -(nRows - 1) * rowH + rowH / 2, maxY: rowH / 2 };
    if (bounds.minX > bounds.maxX) bounds.minX = bounds.maxX = 0;
    if (cam.ty > bounds.maxY || cam.ty < bounds.minY - .01) { cam.ty = bounds.maxY; cam.y = cam.ty; }
    fit(W);
    applyFilter();
    for (const b of books) applyRealCover(b);
    if (keepPulled) { const b = books.find((m) => m.userData.item.id === keepPulled); if (b) pull(b, true); }
  }

  let caseW = 6;
  function fit(W) {
    if (W) caseW = W;
    const rect = host.getBoundingClientRect();
    const aspect = Math.max(rect.width, 1) / Math.max(rect.height, 1);
    const half = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const fitW = (Math.min(caseW, 9) / 2 + .6) / (half * aspect);
    const fitH = (2.35 * 1.6) / half;
    cam.z = Math.max(5.5, Math.min(14, Math.max(fitW, Math.min(fitH, 9))));
    const visHalfW = half * aspect * cam.z;
    const spare = caseW / 2 + .6 - visHalfW;
    bounds.minX = spare > 0 ? -spare : 0; bounds.maxX = spare > 0 ? spare : 0;
    cam.tx = Math.max(bounds.minX, Math.min(bounds.maxX, cam.tx));
  }

  function resize() {
    const r = host.getBoundingClientRect();
    renderer.setSize(r.width, r.height, false);
    camera.aspect = Math.max(r.width, 1) / Math.max(r.height, 1); camera.updateProjectionMatrix();
    fit();
  }

  function matches(it) {
    const q = S.q.toLowerCase();
    if (S.kind && it.kind !== S.kind) return false;
    if (!q) return true;
    return [it.title, it.author, it.shelf].some((v) => (v || "").toLowerCase().includes(q));
  }
  function applyFilter() {
    for (const b of books) {
      const on = matches(b.userData.item);
      b.material.forEach((m, i) => { m.color.copy(b.userData.base[i]); if (!on) m.color.multiplyScalar(.22); });
      b.userData.dim = !on;
    }
  }

  // ---- animation ----
  function tween(mesh, pos, rot, dur, next) {
    mesh.userData.tw = { t0: performance.now(), dur: reduceMotion ? 1 : dur, fp: mesh.position.clone(), tp: pos, fr: mesh.rotation.clone(), tr: rot, next };
  }
  const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function frontSpot() {
    const narrow = host.clientWidth < 640;
    const drawerOffset = narrow ? 0 : Math.min(1.3, 440 / host.clientWidth * 4);
    return new THREE.Vector3(cam.x - drawerOffset, cam.y + (narrow ? 1.1 : .15), cam.z - 4.8);
  }
  function pull(mesh, instant) {
    if (pulled && pulled !== mesh) putBack(pulled);
    pulled = mesh;
    const ud = mesh.userData;
    const out = ud.home.clone(); out.z += 1.05;
    const front = frontSpot();
    const faceRot = new THREE.Euler(-.08, Math.PI / 2 - .35, 0);
    if (instant) { mesh.position.copy(front); mesh.rotation.copy(faceRot); return; }
    tween(mesh, out, ud.homeRot.clone(), 260, () => tween(mesh, front, faceRot, 620));
  }
  function putBack(mesh) {
    const ud = mesh.userData; const out = ud.home.clone(); out.z += 1.05;
    tween(mesh, out, ud.homeRot.clone(), 480, () => tween(mesh, ud.home.clone(), ud.homeRot.clone(), 260));
    if (pulled === mesh) pulled = null;
  }
  function release() { if (pulled) putBack(pulled); }

  // ---- input ----
  const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
  function pick(ev) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(books, false)[0];
    return hit ? hit.object : null;
  }
  let down = null;
  const cv = renderer.domElement;
  cv.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY, tx: cam.tx, ty: cam.ty, drag: false }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", (e) => {
    if (down) {
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (!down.drag && Math.hypot(dx, dy) > 6) down.drag = true;
      if (down.drag) {
        const k = (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * cam.z) / host.clientHeight;
        cam.tx = Math.max(bounds.minX, Math.min(bounds.maxX, down.tx - dx * k));
        cam.ty = Math.max(bounds.minY, Math.min(bounds.maxY, down.ty + dy * k));
        setHover(null); return;
      }
    }
    if (e.pointerType === "mouse") setHover(pick(e), e);
  });
  cv.addEventListener("pointerup", (e) => {
    const wasDrag = down?.drag; down = null;
    if (wasDrag) return;
    const b = pick(e);
    if (b && !b.userData.dim) { if (b === pulled) return; onPick?.(b.userData.item.id); }
    else if (!b && pulled) onPick?.(null);
  });
  cv.addEventListener("pointerleave", () => setHover(null));
  cv.addEventListener("wheel", (e) => {
    e.preventDefault();
    const k = .006 * cam.z / 9;
    cam.ty = Math.max(bounds.minY, Math.min(bounds.maxY, cam.ty - e.deltaY * k));
    cam.tx = Math.max(bounds.minX, Math.min(bounds.maxX, cam.tx + e.deltaX * k));
  }, { passive: false });

  const tip = $("tip");
  function setHover(b, e) {
    if (b && b.userData.dim) b = null;
    hovered = b === pulled ? null : b;
    cv.classList.toggle("hovering", !!hovered);
    if (hovered && e) {
      const r = host.getBoundingClientRect();
      tip.hidden = false; tip.textContent = hovered.userData.item.title;
      tip.style.left = (e.clientX - r.left) + "px"; tip.style.top = (e.clientY - r.top) + "px";
    } else tip.hidden = true;
  }

  // ---- loop ----
  const labelsEl = $("labels"); let labelEls = [];
  function drawLabels() {
    if (labelEls.length !== rows.length) {
      labelsEl.innerHTML = rows.map((r) => `<div class="shelf-label">${esc(r.shelf)}<b>${r.count}</b></div>`).join("");
      labelEls = [...labelsEl.children];
    }
    const w = host.clientWidth, h = host.clientHeight;
    rows.forEach((r, i) => {
      const v = r.pos.clone().project(camera); const el = labelEls[i];
      if (!el) return;
      const x = Math.max(8, (v.x + 1) / 2 * w), y = (1 - v.y) / 2 * h;
      el.style.left = x + "px"; el.style.top = y + "px"; el.style.display = pulled || y < -20 || y > h + 20 ? "none" : "";
    });
  }
  let onPick = null;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!caseGroup || $("scene").hidden) return;
    const k = reduceMotion ? 1 : .14;
    cam.x += (cam.tx - cam.x) * k; cam.y += (cam.ty - cam.y) * k;
    camera.position.set(cam.x, cam.y + .25, cam.z); camera.lookAt(cam.x, cam.y, 0);
    for (const b of books) {
      const ud = b.userData;
      if (ud.tw) {
        const t = Math.min(1, (now - ud.tw.t0) / ud.tw.dur), e = ease(t);
        b.position.lerpVectors(ud.tw.fp, ud.tw.tp, e);
        b.rotation.set(ud.tw.fr.x + (ud.tw.tr.x - ud.tw.fr.x) * e, ud.tw.fr.y + (ud.tw.tr.y - ud.tw.fr.y) * e, ud.tw.fr.z + (ud.tw.tr.z - ud.tw.fr.z) * e);
        if (t >= 1) { const n = ud.tw.next; ud.tw = null; n?.(); }
      } else if (b === pulled) {
        const f = frontSpot(); b.position.lerp(f, .2);
        b.rotation.y = Math.PI / 2 - .35 + (reduceMotion ? 0 : Math.sin(now / 1400) * .05);
      } else {
        const tz = ud.home.z + (b === hovered ? .28 : 0);
        b.position.z += (tz - b.position.z) * (reduceMotion ? 1 : .2);
      }
    }
    drawLabels();
    renderer.render(scene, camera);
  }

  new ResizeObserver(resize).observe(host);
  resize(); applyTheme(); requestAnimationFrame(frame);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  return {
    build, applyFilter, release, resize,
    onPick(fn) { onPick = fn; },
    select(id) { const b = books.find((m) => m.userData.item.id === id); if (b) { cam.ty = Math.max(bounds.minY, Math.min(bounds.maxY, b.userData.home.y - .2)); pull(b); } },
  };
})();

  if (S.tab === "istilah") pane = c.istilah.length ? `<dl class="terms">${c.istilah.map((t) => `<div><dt>${esc(t.istilah)}</dt><dd>${esc(t.arti)}</dd></div>`).join("")}</dl>` : `<p class="meta">Tidak ada istilah.</p>`;
  if (S.tab === "kartu") {

function wireDrawer(it) {
  $("dClose").onclick = closeItem;
  $("dStatus").onchange = (e) => store.update(it.id, { status: e.target.value });
  $("dShelf").onchange = (e) => { const v = e.target.value.trim(); if (v) store.update(it.id, { shelf: v }); };
  if ($("dDel")) $("dDel").onclick = () => { S.confirmDelete = true; renderDrawer(); };
  if ($("dDelNo")) $("dDelNo").onclick = () => { S.confirmDelete = false; renderDrawer(); };
  if ($("dDelYes")) $("dDelYes").onclick = async () => { const id = it.id; S.selected = null; scene3.release(); renderDrawer(); await store.remove(id); };
  document.querySelectorAll("#drawer [data-tab]").forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; S.flipped = false; renderDrawer(); });
  if ($("card")) $("card").onclick = () => { S.flipped = !S.flipped; $("card").classList.toggle("flipped", S.flipped); };
  if ($("cPrev")) $("cPrev").onclick = () => { S.card--; S.flipped = false; renderDrawer(); };
  if ($("cNext")) $("cNext").onclick = () => { S.card++; S.flipped = false; renderDrawer(); };
  if ($("apiKey")) $("apiKey").onchange = (e) => lsSet("rakbuku.apikey", e.target.value.trim());
  if ($("cSwap")) $("cSwap").onclick = () => store.update(it.id, { sumber: null });
  if ($("cRun")) $("cRun").onclick = () => runCuration(it.id);
}

async function runCuration(id) {
  const it = S.items.find((x) => x.id === id); if (!it) return;
  const busy = (msg, err) => { S.busy = { msg, err }; if (S.selected === id) renderDrawer(); };
  try {
    let text = it.sumber, patch = {};
    if (!text) {
      const file = $("cPdf")?.files?.[0]; const pasted = $("cText")?.value.trim();
      if (file) {
        busy("Memuat pembaca PDF…");
        const r = await pdfToText(file, (p, n) => busy(`Membaca PDF… halaman ${p} dari ${n}`));
        text = r.text; patch = { sumber: text, pdfName: file.name };
      } else if (pasted) { text = pasted.slice(0, MAX_SOURCE_CHARS); patch = { sumber: text }; }
      else return busy("Pilih file PDF atau tempel teks dulu.", true);
    }
    if (!ai.ready) { if (Object.keys(patch).length) await store.update(id, patch); return busy("Masukkan kunci API Claude di atas, lalu tekan Kurasi lagi.", true); }
    busy("Claude sedang membaca dan menyusun kurasi… (biasanya 20–60 detik)");
    const curation = await ai.curate(it, text);
    await store.update(id, { ...patch, curation });
    S.busy = null; S.tab = "ringkasan"; S.card = 0;
    if (S.selected === id) renderDrawer();
  } catch (e) {
    const code = e?.code;
    busy(code === "rate_limited" ? "Batas pemakaian Claude tercapai. Coba lagi beberapa saat lagi." : code === "not_granted" ? "Izin memakai Claude ditolak untuk halaman ini." : (e?.message || String(e)), true);
  }
}

// ---------- book lookup: Google Books first, Open Library as fallback, Claude when offline ----------
const LANG = { ind: "ID", eng: "EN", jpn: "JA", may: "MS", msa: "MS", ger: "DE", fre: "FR", spa: "ES", chi: "ZH", kor: "KO" };
function groupEditions(list) {
  const out = new Map();
  for (const b of list) {
    const k = (b.title + "|" + (b.authors[0] || "")).normalize("NFKC").toLowerCase().replace(/[^\p{L}\p{N}|]+/gu, "");
    const prev = out.get(k);
    if (prev) { prev.editions = (prev.editions || 1) + 1; if (!prev.cover && b.cover) prev.cover = b.cover; if (!prev.isbn && b.isbn) prev.isbn = b.isbn; }
    else out.set(k, { ...b, editions: b.editions || 1 });
  }
  return [...out.values()];
}
async function googleBooks(q, by) {
  const term = by === "isbn" ? "isbn:" + q.replace(/[^0-9Xx]/g, "") : (by === "author" ? "inauthor:" : "intitle:") + q;
  const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(term)}&maxResults=20&printType=books`);
  if (!r.ok) throw new Error("Google Books " + r.status);
  const j = await r.json();
  return groupEditions((j.items || []).map((v) => {
    const i = v.volumeInfo || {}; const ids = i.industryIdentifiers || [];
    const isbn = (ids.find((x) => x.type === "ISBN_13") || ids.find((x) => x.type === "ISBN_10") || {}).identifier || "";
    return {
      title: i.title + (i.subtitle ? ": " + i.subtitle : ""), authors: i.authors || [], year: (i.publishedDate || "").slice(0, 4),
      publisher: i.publisher || "", isbn, pages: i.pageCount || null, lang: (i.language || "").toUpperCase(),
      cover: (i.imageLinks?.thumbnail || i.imageLinks?.smallThumbnail || "").replace(/^http:/, "https:").replace("&edge=curl", ""),
      description: i.description || "",
    };
  }));
}
async function openLibrary(q, by) {
  const field = by === "isbn" ? "isbn" : by === "author" ? "author" : "title";
  const val = by === "isbn" ? q.replace(/[^0-9Xx]/g, "") : q;
  const r = await fetch(`https://openlibrary.org/search.json?${field}=${encodeURIComponent(val)}&limit=20&fields=title,author_name,first_publish_year,isbn,cover_i,publisher,language,number_of_pages_median,edition_count`);
  if (!r.ok) throw new Error("Open Library " + r.status);
  const j = await r.json();
  return (j.docs || []).map((d) => ({
    title: d.title, authors: d.author_name || [], year: d.first_publish_year ? String(d.first_publish_year) : "",
    publisher: (d.publisher || [])[0] || "", isbn: by === "isbn" ? val : ((d.isbn || []).find((x) => x.length === 13) || (d.isbn || [])[0] || ""),
    pages: d.number_of_pages_median || null, lang: LANG[(d.language || [])[0]] || ((d.language || [])[0] || "").slice(0, 2).toUpperCase(),
    cover: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : "", editions: d.edition_count || 1, description: "",
  }));
}
async function claudeBooks(q, by) {
  const what = { title: "judul", author: "penulis", isbn: "ISBN" }[by];
  const out = await ai.sample.json(`Seseorang mencari buku berdasarkan ${what}: "${q}". Sebutkan sampai 6 buku yang benar-benar ada dan paling cocok, utamakan edisi bahasa Indonesia bila ada.
Balas HANYA dengan array JSON: [{"title": "", "authors": [""], "year": "", "publisher": "", "isbn": "", "pages": null, "lang": "ID", "description": "1-2 kalimat tentang isi buku"}].
Kosongkan isbn, year, publisher, atau pages bila kamu tidak yakin. Jangan mengarang buku. Jika tidak tahu, balas [].`, { modelTier: "quick" });
  return (Array.isArray(out) ? out : []).filter((b) => b && b.title).map((b) => ({ title: String(b.title), authors: Array.isArray(b.authors) ? b.authors.map(String) : [], year: String(b.year || ""), publisher: String(b.publisher || ""), isbn: String(b.isbn || ""), pages: Number(b.pages) || null, lang: String(b.lang || ""), cover: "", description: String(b.description || ""), editions: 1 }));
}
async function searchBooks(q, by) {
  let netOk = false;
  try { const list = await googleBooks(q, by); netOk = true; if (list.length) return { list, source: "Google Books" }; } catch {}
  try { const list = await openLibrary(q, by); netOk = true; if (list.length || netOk) return { list, source: "Open Library" }; } catch {}
  if (netOk) return { list: [], source: "" };
  if (ai.sample) return { list: await claudeBooks(q, by), source: "claude" };
  throw new Error("Pencarian buku tidak bisa tersambung ke internet di sini. Isi data buku lewat Manual.");
}

// ---------- barcode scanning (ZXing loaded on first use) ----------
let zxReady = null;
function loadZxing() { zxReady ||= loadScript("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js").then(() => window.ZXing); return zxReady; }
let scanReader = null;
function stopScan() { try { scanReader?.reset(); } catch {} scanReader = null; $("scanBox").hidden = true; }
async function startScan() {
  $("searchStatus").textContent = ""; $("searchStatus").classList.remove("err");
  $("photoBtn").hidden = true;
  if (!navigator.mediaDevices?.getUserMedia) return $("scanFile").click(); // still inside the tap, so the picker opens
  try {
    const ZX = await loadZxing();
    scanReader = new ZX.BrowserMultiFormatReader();
    $("scanBox").hidden = false;
    await scanReader.decodeFromConstraints({ video: { facingMode: "environment" } }, $("scanVideo"), (res) => { if (res) { stopScan(); onIsbn(res.getText()); } });
  } catch {
    // The camera was refused after an async wait, so the tap no longer counts; let the user open the picker themselves.
    stopScan();
    setSearchStatus("Kamera tidak bisa dipakai di sini. Foto barcode-nya saja.");
    $("photoBtn").hidden = false;
  }
}
async function scanPhoto(file) {
  setSearchStatus("Membaca barcode…");
  const url = URL.createObjectURL(file);
  try {
    let code = null;
    if ("BarcodeDetector" in window) {
      try { const det = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a"] }); const bmp = await createImageBitmap(file); code = (await det.detect(bmp))[0]?.rawValue || null; } catch {}
    }
    if (!code) { const ZX = await loadZxing(); code = (await new ZX.BrowserMultiFormatReader().decodeFromImageUrl(url)).getText(); }
    onIsbn(code);
  } catch {
    setSearchStatus("Barcode tidak terbaca. Foto lebih dekat dan terang, atau ketik ISBN-nya.", true);
  } finally { URL.revokeObjectURL(url); }
}
function onIsbn(code) {
  setBy("isbn"); $("bq").value = code; runSearch(true);
}

// ---------- add sheet ----------
let addKind = "buku", addMode = "search", searchBy = "title", lastResults = [], lastSource = "", searchSeq = 0, picked = null;
const BY_PLACEHOLDER = { title: "Judul buku, mis. Laut Bercerita", author: "Nama penulis, mis. Leila S. Chudori", isbn: "ISBN, mis. 9786024246945" };
function setSearchStatus(t, err) { $("searchStatus").textContent = t || ""; $("searchStatus").classList.toggle("err", !!err); }
function setBy(by) {
  searchBy = by;
  document.querySelectorAll("[data-by]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.by === by));
  $("bq").placeholder = BY_PLACEHOLDER[by]; $("bq").inputMode = by === "isbn" ? "numeric" : "text";
}
function shelfOptions() { $("shelfList").innerHTML = [...new Set(S.items.map((x) => x.shelf))].map((s) => `<option value="${esc(s)}">`).join(""); }
function openAdd() {
  $("addForm").reset(); $("addStatus").textContent = ""; picked = null;
  shelfOptions();
  setKind(S.kind || "buku", "search");
  $("modal").hidden = false;
  (addKind === "buku" ? $("bq") : $("aTitle")).focus();
}
function closeAdd() { stopScan(); $("modal").hidden = true; }
function setKind(k, mode) {
  addKind = k; addMode = k === "buku" ? (mode || "search") : "manual";
  document.querySelectorAll(".kinds button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.kind === k));
  $("sheetTitle").textContent = { buku: "Tambah buku", artikel: "Tambah artikel", materi: "Tambah materi kuliah" }[k];
  $("urlField").hidden = k !== "artikel"; $("pdfField").hidden = k !== "materi";
  $("aAuthor").placeholder = k === "buku" ? "mis. James Stewart" : k === "artikel" ? "mis. Kompas.id" : "mis. Slide dosen";
  $("bookSearch").hidden = addMode !== "search"; $("bookDetail").hidden = addMode !== "detail"; $("addForm").hidden = addMode !== "manual";
  $("manualBtn").hidden = k !== "buku";
  $("manualBtn").querySelector("span").textContent = addMode === "manual" ? "Cari" : "Manual";
  if (addMode !== "search") stopScan();
}
function coverThumb(b, cls) {
  return `<span class="thumb ${cls || ""}" style="--c:${colorFor({ title: b.title, shelf: "" })}">${b.cover ? `<img class="cov" src="${esc(b.cover)}" alt="" loading="lazy">` : ""}<em>${esc(b.title.slice(0, 40))}</em></span>`;
}
function renderResults() {
  $("resHead").hidden = !lastResults.length && !lastSource;
  $("resCount").textContent = lastResults.length ? `${lastResults.length} hasil` : (lastSource ? "Tidak ada hasil" : "");
  $("resSource").textContent = lastSource === "claude" ? "saran Claude, cek kembali" : lastSource ? "dari " + lastSource : "";
  $("results").innerHTML = lastResults.map((b, i) => `
    <button type="button" class="result" data-i="${i}">
      ${coverThumb(b)}
      <span class="result-main">
        <b>${esc(b.title)}</b>
        <span class="by">${esc(b.authors.join(", ") || "Penulis tidak diketahui")}</span>
        <span class="pills">${b.editions > 1 ? `<span class="pill warm">${b.editions} edisi</span>` : b.year ? `<span class="pill">${esc(b.year)}</span>` : ""}${b.lang ? `<span class="pill">${esc(b.lang)}</span>` : ""}</span>
      </span>
      <span class="chev" aria-hidden="true">›</span>
    </button>`).join("") + (lastSource === "claude" && lastResults.length ? `<p class="status-line">Pencarian online tidak tersedia di pratinjau claude.ai, jadi hasil ini disusun Claude dari pengetahuannya. Di versi web penuh, hasil diambil dari Google Books dan Open Library.</p>` : "");
}
let searchTimer = 0;
async function runSearch(autoOpen) {
  const q = $("bq").value.trim();
  if (searchBy === "title" && /^(97[89])?\d{9}[\dXx]$/.test(q.replace(/[-\s]/g, ""))) setBy("isbn");
  if (q.length < 2) { searchSeq++; lastResults = []; lastSource = ""; renderResults(); setSearchStatus(""); return; }
  const seq = ++searchSeq;
  setSearchStatus(searchBy === "isbn" ? `Mencari ISBN ${q}…` : "Mencari…");
  try {
    const r = await searchBooks(q, searchBy);
    if (seq !== searchSeq) return;
    lastResults = r.list; lastSource = r.source; setSearchStatus(""); renderResults();
    if (autoOpen && lastResults.length === 1) showBook(lastResults[0]);
  } catch (e) {
    if (seq !== searchSeq) return;
    lastResults = []; lastSource = ""; renderResults(); setSearchStatus(e?.message || String(e), true);
  }
}
function showBook(b) {
  picked = b; setKind("buku", "detail");
  const lastShelf = lsGet("rakbuku.lastShelf", "");
  const facts = [["Penerbit", b.publisher], ["Terbit", b.year], ["Halaman", b.pages], ["ISBN", b.isbn], ["Bahasa", b.lang]].filter(([, v]) => v);
  $("bookDetail").innerHTML = `
    <button type="button" class="back" id="bdBack" aria-label="Kembali ke hasil">←</button>
    <div class="hero-cover">${coverThumb(b, "big")}</div>
    <h3 class="book-title">${esc(b.title)}</h3>
    <p class="book-by">${esc(b.authors.join(", "))}</p>
    <div class="fields">
      <label class="f">Rak<input id="bdShelf" list="shelfList" value="${esc(lastShelf)}" placeholder="mis. Bacaan santai"></label>
      <label class="f">Status<select id="bdStatus">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></label>
    </div>
    <button type="button" class="btn primary big" id="bdAdd"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Tambah ke rak</button>
    <p class="status-line" id="bdStatusLine"></p>
    ${facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>` : ""}
    ${b.description ? `<p class="desc">${esc(b.description.replace(/<[^>]+>/g, "").slice(0, 900))}</p>` : ""}`;
  $("bdBack").onclick = () => setKind("buku", "search");
  $("bdAdd").onclick = async () => {
    const shelf = $("bdShelf").value.trim();
    if (!shelf) { $("bdStatusLine").textContent = "Isi nama rak dulu, mis. Bacaan santai."; $("bdShelf").focus(); return; }
    lsSet("rakbuku.lastShelf", shelf);
    const data = { kind: "buku", title: b.title, author: b.authors.join(", "), shelf, status: $("bdStatus").value };
    for (const k of ["isbn", "publisher", "year", "pages", "lang", "cover"]) if (b[k]) data[k] = b[k];
    if (b.description) data.description = b.description.replace(/<[^>]+>/g, "").slice(0, 1500);
    $("bdAdd").disabled = true;
    try { await saveNew(data); } catch (e) { $("bdStatusLine").textContent = e?.message || String(e); } finally { $("bdAdd").disabled = false; }
  };
  $("bookDetail").scrollIntoView?.({ block: "start" });
}
async function saveNew(data) {
  S.pendingOpen = "?";
  const id = await store.add(data);
  closeAdd();
  if (S.items.some((x) => x.id === id)) { S.pendingOpen = null; openItem(id); } else S.pendingOpen = id;
}

document.querySelectorAll(".kinds button").forEach((b) => b.onclick = () => setKind(b.dataset.kind));
document.querySelectorAll("[data-by]").forEach((b) => b.onclick = () => { setBy(b.dataset.by); runSearch(); $("bq").focus(); });
$("bq").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 450); });
$("bq").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); clearTimeout(searchTimer); runSearch(true); } });
$("results").addEventListener("click", (e) => { const r = e.target.closest(".result"); if (r) showBook(lastResults[+r.dataset.i]); });
$("scanBtn").onclick = startScan;
$("scanStop").onclick = stopScan;
$("photoBtn").onclick = () => { $("photoBtn").hidden = true; $("scanFile").click(); };
$("scanFile").onchange = (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) scanPhoto(f); };
$("manualBtn").onclick = () => {
  if (addMode === "manual") return setKind("buku", "search");
  setKind("buku", "manual");
  if (!$("aTitle").value && $("bq").value && searchBy === "title") $("aTitle").value = $("bq").value;
  $("aTitle").focus();
};
$("aPdf").onchange = (e) => { const f = e.target.files[0]; if (f && !$("aTitle").value) $("aTitle").value = f.name.replace(/\.pdf$/i, "").replace(/[_-]+/g, " "); };
$("aUrl").onchange = (e) => { try { const u = new URL(e.target.value); if (!$("aAuthor").value) $("aAuthor").value = u.hostname.replace(/^www\./, ""); } catch {} };
$("addCancel").onclick = closeAdd;
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeAdd(); });
document.addEventListener("error", (e) => { if (e.target?.classList?.contains("cov")) e.target.remove(); }, true);
$("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = { kind: addKind, title: $("aTitle").value.trim(), author: $("aAuthor").value.trim(), shelf: $("aShelf").value.trim(), status: $("aStatus").value };
  if (!data.title || !data.shelf) return;
  if (addKind === "artikel" && $("aUrl").value.trim()) data.url = $("aUrl").value.trim();
  const file = addKind === "materi" ? $("aPdf").files[0] : null;
  $("addSubmit").disabled = true;
  try {
    if (file) {
      $("addStatus").textContent = "Membaca PDF…";
      const r = await pdfToText(file, (p, n) => $("addStatus").textContent = `Membaca PDF… halaman ${p} dari ${n}`);
      data.sumber = r.text; data.pdfName = file.name;
    }
    lsSet("rakbuku.lastShelf", data.shelf);
    await saveNew(data);
  } catch (err) {
    $("addStatus").textContent = err?.message || String(err);
  } finally { $("addSubmit").disabled = false; }
});

// ---------- wiring ----------
$("vRak").onclick = () => setView("rak");
$("vList").onclick = () => setView("list");
$("addBtn").onclick = openAdd; $("emptyAdd").onclick = openAdd;
$("q").addEventListener("input", (e) => { S.q = e.target.value; scene3.applyFilter(); renderList(); });
$("fKind").onchange = (e) => { S.kind = e.target.value; scene3.applyFilter(); renderList(); };
$("listInner").addEventListener("click", (e) => { const r = e.target.closest(".row"); if (r) openItem(r.dataset.id); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (!$("modal").hidden) closeAdd(); else if (S.selected) closeItem(); } });
scene3.onPick((id) => id ? openItem(id) : closeItem());

function onItems(items) {
  S.items = items; S.loaded = true;
  if (S.selected && !current()) S.selected = null;
  scene3.build(items);
  renderEmpty(); renderList();
  if (S.pendingOpen && S.pendingOpen !== "?" && items.some((x) => x.id === S.pendingOpen)) { const id = S.pendingOpen; S.pendingOpen = null; openItem(id); }
  else renderDrawer();
}

setView(S.view);
(async () => {
  await Promise.all([store.init(onItems), ai.init()]);
  const n = S.items.length;
  setNote(store.mode === "db" ? "tersimpan di akunmu" : "tersimpan di browser ini");
})();
})();
</script>
